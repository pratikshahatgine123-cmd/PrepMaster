```html
<!DOCTYPE html>
<html>
<head>

    <title>PrepMaster | Contact</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eff6ff;
            color: #222;
        }

        /* Navigation Bar */

        nav {
            background: #172554;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        /* Contact Box */

        .box {
            width: 500px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* Footer */

        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }

    </style>

</head>

<body>

    <!-- Navigation Bar -->

    <nav>

        <div class="logo">
            PrepMaster
        </div>

        <div>

            <a href="index.html">Home</a>

            <a href="aptitude.html">Aptitude</a>

            <a href="interview.html">Interview</a>

            <a href="contact.html">Contact</a>

            <a href="feedback.html">Feedback</a>

            <a href="login.html">Login</a>

        </div>

    </nav>


    <!-- Contact Form -->

    <div class="box">

        <h1>Contact Us</h1>

        <form action="thanks.html">

            <label>Name</label>

            <input
                type="text"
                placeholder="Enter your name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >


            <label>Subject</label>

            <input
                type="text"
                placeholder="Enter subject"
                required
            >


            <label>Message</label>

            <textarea
                placeholder="Enter your message"
                required
            ></textarea>


            <button type="submit">
                Send Message
            </button>

        </form>


        <div class="links">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 PrepMaster | Aptitude & Interview Preparation
        </p>

    </footer>

</body>
</html>
