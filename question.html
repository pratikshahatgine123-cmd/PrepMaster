
<!DOCTYPE html>
<html>
<head>
    <title>PrepMaster | Aptitude Test</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        .test {
            width: 750px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 30px;
        }

        .question {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .question p {
            font-weight: bold;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="test">

    <h1>Aptitude Test</h1>

    <form action="result.html">

        <div class="question">
            <p>1. What is 20% of 200?</p>

            <label><input type="radio" name="q1" required> 20</label>
            <label><input type="radio" name="q1"> 30</label>
            <label><input type="radio" name="q1"> 40</label>
            <label><input type="radio" name="q1"> 50</label>
        </div>

        <div class="question">
            <p>2. Find the next number: 2, 4, 6, 8, ?</p>

            <label><input type="radio" name="q2" required> 9</label>
            <label><input type="radio" name="q2"> 10</label>
            <label><input type="radio" name="q2"> 12</label>
            <label><input type="radio" name="q2"> 14</label>
        </div>

        <div class="question">
            <p>3. If 5 × 6 = ?</p>

            <label><input type="radio" name="q3" required> 20</label>
            <label><input type="radio" name="q3"> 25</label>
            <label><input type="radio" name="q3"> 30</label>
            <label><input type="radio" name="q3"> 35</label>
        </div>

        <div class="question">
            <p>4. What is the average of 10 and 20?</p>

            <label><input type="radio" name="q4" required> 10</label>
            <label><input type="radio" name="q4"> 15</label>
            <label><input type="radio" name="q4"> 20</label>
            <label><input type="radio" name="q4"> 25</label>
        </div>

        <div class="question">
            <p>5. Which number is even?</p>

            <label><input type="radio" name="q5" required> 13</label>
            <label><input type="radio" name="q5"> 17</label>
            <label><input type="radio" name="q5"> 21</label>
            <label><input type="radio" name="q5"> 24</label>
        </div>

        <button type="submit">Submit Test</button>

    </form>

    <a href="aptitude.html">← Back to Aptitude</a>
    <a href="index.html">← Back to Home</a>

</div>

</body>
</html>
